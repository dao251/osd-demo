<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hi-Color-Precision test</title>
  <style>
    #container {
      display: flex;
      gap: 8px;
    }
    #container > * {
      /* border: 1px solid black; */
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

<div id="container"></div>

<script>
    const DPR = window.devicePixelRatio || 1;
    const DEVICE_SIZE = 512;                      // actual backing resolution
    const CSS_SIZE = DEVICE_SIZE / DPR;           // CSS pixels

    const container = document.getElementById('container');

    let img;

    img = new Image(CSS_SIZE, CSS_SIZE);
    img.src = "../../test/data/blue_gradient8.png";
    container.appendChild(img);

    img = new Image(CSS_SIZE, CSS_SIZE);
    img.src = "../../test/data/blue_gradient16.png";
    container.appendChild(img);

    const ctx0 = createCanvas('c0').getContext("2d");
    generate8bit(ctx0,  "#4AA3FF", "#1E90FF");

    const ctx1 = createCanvas('c1')
        .getContext("2d", {
                // colorSpace: "display-p3",
                pixelFormat: "float16"
            });
    generate16bit(ctx1,  "#4AA3FF", "#1E90FF");

    img = new Image(CSS_SIZE, CSS_SIZE);
    img.src = "../../test/data/blue_gradient10.avif";
    container.appendChild(img);

// ----------------------------------------------------------------------------

    function createCanvas( id ){
        const canvas = document.createElement('canvas');
        canvas.id = id;
        canvas.width  = canvas. height = DEVICE_SIZE;
        canvas.style.width  = canvas.style.height = CSS_SIZE + "px";
        container.appendChild(canvas);
        return canvas;
    }

    function sRGBToLinearRGB(v) {
        v = v / 255;
        return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    }

    function linearRGBToSRGB(v) {
    return v <= 0.0031308
        ? v * 12.92
        : 1.055 * Math.pow(v, 1/2.4) - 0.055;
    }

    function hexToLinearRGB(hex) {
        const r = sRGBToLinearRGB(parseInt(hex.slice(1,3),16));
        const g = sRGBToLinearRGB(parseInt(hex.slice(3,5),16));
        const b = sRGBToLinearRGB(parseInt(hex.slice(5,7),16));
        return [r, g, b];
    }

function generate8bit(ctx, color0, color1) {
  const w = ctx.canvas.width;
  const h = ctx.canvas.height;

  const img = ctx.createImageData(w, h);
  const data = img.data;

  const c0 = hexToLinearRGB(color0);
  const c1 = hexToLinearRGB(color1);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {

      // Correct diagonal projection (GIMP-compatible)
      const t = (x*w + y*h) / (w*w + h*h);

      const rLin = c0[0] + (c1[0] - c0[0]) * t;
      const gLin = c0[1] + (c1[1] - c0[1]) * t;
      const bLin = c0[2] + (c1[2] - c0[2]) * t;

      const i = (y * w + x) * 4;

      data[i]   = Math.round(linearRGBToSRGB(rLin) * 255);
      data[i+1] = Math.round(linearRGBToSRGB(gLin) * 255);
      data[i+2] = Math.round(linearRGBToSRGB(bLin) * 255);
      data[i+3] = 255;
    }
  }

  ctx.putImageData(img, 0, 0);
}

function generate16bit(ctx, color0, color1) {
  const w = ctx.canvas.width;
  const h = ctx.canvas.height;

  const img = new ImageData(w, h, { pixelFormat: "rgba-float16" });
  const data = img.data;

  const c0 = hexToLinearRGB(color0);
  const c1 = hexToLinearRGB(color1);

  const denom = (w*w + h*h);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {

      const t = (x*w + y*h) / denom;

      const rLin = c0[0] + (c1[0] - c0[0]) * t;
      const gLin = c0[1] + (c1[1] - c0[1]) * t;
      const bLin = c0[2] + (c1[2] - c0[2]) * t;

      const i = (y * w + x) * 4;

      // Gamma encode before writing to float16
      data[i]   = linearRGBToSRGB(rLin);
      data[i+1] = linearRGBToSRGB(gLin);
      data[i+2] = linearRGBToSRGB(bLin);
      data[i+3] = 1.0;
    }
  }

  ctx.putImageData(img, 0, 0);
}


</script>
</body>
</html>
